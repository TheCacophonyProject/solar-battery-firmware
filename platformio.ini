; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATtiny1616]
platform = atmelmegaavr@1.9.0
board = ATtiny1616
framework = arduino
board_build.f_cpu = 20000000L
build_flags =
    !echo '-D MAJOR_VERSION='${MAJOR_VERSION:-0}
    !echo '-D MINOR_VERSION='${MINOR_VERSION:-0}
    !echo '-D PATCH_VERSION='${PATCH_VERSION:-0}
platform_packages =
    platformio/framework-arduino-megaavr-megatinycore @ 2.6.7
    platformio/toolchain-atmelavr @ 3.70300.220127
